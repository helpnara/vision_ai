# Streamlit 앱 설정 (로컬 실행 / Community Cloud 배포 공통)
#
# 서버 주소·포트는 여기서 고정하지 않는다. Community Cloud가 자체적으로 지정하므로
# 여기서 박아두면 배포 시 충돌한다.

[browser]
# 사내 확장을 염두에 둔 PoC라 사용 통계 전송을 끈다.
gatherUsageStats = false

[server]
# 1단계 업로드 탭 상한(MB). 무료 배포 환경은 메모리가 넉넉하지 않으므로
# 대용량 데이터셋은 업로드 대신 폴더 인덱싱(로컬 실행)으로 다룬다.
maxUploadSize = 200

[theme]
# base를 고정하지 않는다. 비워 두면 Streamlit이 브라우저·OS의 밝게/어둡게 설정을 따라간다.
# 예전에는 base = "light"로 못박아, 어둡게 쓰는 사람에게도 흰 화면만 나왔다.
primaryColor = "#2563eb"

# 글자 크기 — 기본값은 발표용 슬라이드에 가깝게 커서, 실제로 데이터를 보며 작업할 때
# 한 화면에 들어오는 정보가 너무 적었다. 아래 값은 "읽기 쉬운 최소 크기"를 지키면서
# 제목이 차지하는 세로 공간을 줄인 것이다. CSS 주입 대신 Streamlit이 공식 지원하는
# 테마 옵션만 사용한다 (1.60 기준). 사이드바 제목 크기는 별도 기본값을 따르므로
# 여기 설정이 상속되지 않는다.
baseFontSize = 15
# 기본값: h1 2.75 / h2 2.25 / h3 1.75 / h4 1.5 / h5 1.25 / h6 1 rem
headingFontSizes = ["1.7rem", "1.35rem", "1.15rem", "1.02rem", "0.95rem", "0.88rem"]
# h1만 굵게 두고 나머지는 준굵게 — 크기를 줄인 만큼 굵기로 위계를 유지한다.
headingFontWeights = [700, 600, 600, 600, 600, 600]
# 기본값 2.25rem. AUROC·재현율 같은 지표를 여러 개 나란히 놓기 때문에 줄인다.
metricValueFontSize = "1.5rem"
codeFontSize = "0.8rem"

[theme.dark]
# primaryColor는 두 가지로 동시에 쓰인다 — 강조 요소의 색이면서 기본 버튼의 '배경'이다.
# 그래서 어두운 배경에 맞춰 밝히기만 하면 버튼 위 흰 글씨가 안 읽힌다. 실측 대비:
#   #60a5fa  흰글씨 2.54 : 배경 7.43   ← 버튼 글자가 안 읽힘
#   #3b82f6  흰글씨 3.68 : 배경 5.14   ← 일반 글자 기준(4.5) 미달
#   #2f6fe4  흰글씨 4.65 : 배경 4.06   ← 둘 다 통과
# 링크는 배경이 아니라 글자색이라 제약이 달라 따로 더 밝게 둔다(배경 대비 11.3).
# 글자 크기 등 나머지 값은 [theme]에서 그대로 상속된다.
primaryColor = "#2f6fe4"
linkColor = "#7dd3fc"
