[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-ai-surface-defect"
version = "0.1.0"
description = "오픈 데이터셋 기반 표면 결함 탐지 파이프라인 (FastAPI + React)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "pillow>=10.0",
    "opencv-python-headless>=4.9",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]
claude = ["anthropic>=0.60"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# 규칙 묶음을 못 박는다. 안 정하면 ruff 기본값을 따르는데, 0.16에서 기본 규칙이 넓어져
# 같은 코드가 9건 → 115건(정렬·업그레이드·RUF 계열)으로 뛰었다(2026-11-09 새 컨테이너 실측).
# «새로 건드린 파일에서 수가 늘지 않는지만 본다»는 습관이 판에 따라 흔들리지 않게 예전 기본값 그대로 둔다.
select = ["E4", "E7", "E9", "F"]
